services:
  mysql:
    image: mysql:8.0
    container_name: bilito-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bilito
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - bilito-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bilito-mysql-data:
